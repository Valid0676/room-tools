name: Build RoomTools.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller==6.11.1

      - name: Stamp the build number
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ github.run_number }}" }
          (Get-Content x32_bridge.py) -replace 'VERSION = "dev"', "VERSION = `"$v`"" | Set-Content x32_bridge.py

      - name: Build
        run: >
          pyinstaller --onefile --console --name RoomTools
          --add-data "room-tuning.html;."
          --add-data "feedback-finder.html;."
          x32_bridge.py

      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist\RoomTools.exe -ArgumentList "--no-browser" -PassThru
          Start-Sleep 5
          $ping = Invoke-RestMethod http://localhost:8032/api/ping
          $page = Invoke-WebRequest http://localhost:8032/room-tuning.html -UseBasicParsing
          Stop-Process $p.Id
          if (-not $ping.ok -or $page.StatusCode -ne 200) { throw "exe did not serve the pages" }
          "Bridge build $($ping.bridge) OK"

      - uses: actions/upload-artifact@v4
        with:
          name: RoomTools-build-${{ github.run_number }}
          path: dist/RoomTools.exe

      - name: Publish release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RoomTools.exe
